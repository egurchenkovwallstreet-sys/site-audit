name: site-audit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_audit}
      POSTGRES_USER: ${POSTGRES_USER:-site_audit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - site_audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-site_audit} -d ${POSTGRES_DB:-site_audit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-site_audit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-site_audit}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-${NEXT_PUBLIC_API_URL:-http://localhost}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - internal

  # Тестовый SMTP без ящика: письма не уходят в интернет, смотреть в веб-UI (Mailpit)
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  # Шаг 3+: раскомментировать на сервере при включении сканеров
  # zap:
  #   image: ghcr.io/zaproxy/zaproxy:stable
  #   ...
  # nuclei:
  #   image: projectdiscovery/nuclei:latest
  #   ...

volumes:
  site_audit_pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge