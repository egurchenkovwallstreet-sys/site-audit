# Witty Vulpecula: порт 80 занят nginx (ai-aggregator).
# Запуск: docker compose -f docker-compose.yml -f deploy/docker-compose.witty.yml up -d --build db backend frontend

services:
  backend:
    ports:
      - "127.0.0.1:8001:8000"

  frontend:
    ports:
      - "127.0.0.1:3001:3000"

  mailpit:
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    profiles:
      - disabled-on-witty