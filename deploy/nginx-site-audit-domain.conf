# HTTPS-вход для audit152fz.online (и ваш боевой домен).
# Копировать: /etc/nginx/sites-available/site-audit-domain
# ln -sf .../sites-available/site-audit-domain /etc/nginx/sites-enabled/
# certbot: см. scripts/enable-site-audit-domain.sh
#
# Порт :8080 (site-audit.conf) остаётся для IP и отладки.

upstream site_audit_api_domain {
    server 127.0.0.1:8001;
    keepalive 4;
}

upstream site_audit_front_domain {
    server 127.0.0.1:3001;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name audit152fz.online www.audit152fz.online;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # До certbot сайт открывается по HTTP; после certbot --nginx появится :443 и редирект.
    location /api/ {
        proxy_pass http://site_audit_api_domain;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://site_audit_front_domain;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
    location /docs {
        proxy_pass http://site_audit_api_domain;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://site_audit_api_domain;
        proxy_set_header Host $host;
    }
}

# HTTPS: certbot --nginx -d audit152fz.online -d www.audit152fz.online
# (после DNS на 194.87.220.206), см. docs/domain-reg-ru.md