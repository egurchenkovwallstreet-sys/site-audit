# /etc/nginx/sites-available/site-audit — порт 8080, не трогает ai-aggregator на :80
# Доступ: http://194.87.220.206:8080

upstream site_audit_api {
    server 127.0.0.1:8001;
    keepalive 4;
}

upstream site_audit_front {
    server 127.0.0.1:3001;
    keepalive 4;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://site_audit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://site_audit_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://site_audit_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://site_audit_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}